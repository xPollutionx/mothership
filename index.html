<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mothership</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    :root {
      --gap: clamp(4px, 1vmin, 10px);
      /* Reserve room for the title, quote, padding, and gaps at normal zoom. */
      --tile-size: min(90px, calc((100svh - 180px) / 7), calc((100vw - 96px) / 7));
      font-size: clamp(8px, min(1.3vw, 1.9svh), 16px);
    }

    * { box-sizing: border-box; }

    body {
      width: min(1200px, calc(100% - 32px));
      margin: 0 auto;
      padding: 12px 0;
      background: black;
      color: white;
      font-family: 'Press Start 2P', cursive;
    }

    header { text-align: center; }
    h1 {
      font-size: clamp(10px, 2vw, 22px);
      line-height: 1.5;
      margin: 0 0 var(--gap);
    }

    .search-container {
      display: flex;
      align-items: center;
      gap: var(--gap);
    }

    .tiles-wrapper { display: flex; gap: var(--gap); }
    .tile-link {
      display: flex;
      flex: 0 0 var(--tile-size);
      align-items: center;
      justify-content: center;
      width: var(--tile-size);
      height: var(--tile-size);
      border: 3px solid #222;
      border-radius: 10px;
      padding: clamp(3px, 1vmin, 10px);
      position: relative;
      background: #333;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .tile-link:hover, .tile-link:focus-visible {
      transform: scale(1.08);
      z-index: 5;
      border-color: #d6a2e8;
      box-shadow: 0 0 0 3px #c87beb, 0 0 20px rgba(186, 85, 211, 0.85), 0 8px 16px rgba(0, 0, 0, 0.6);
    }

    .tile-youtube, .tile-netflix { background: #fff; }
    .tile-disney { background: #03173d; }
    .tile-fandango { background: #0c111c; }
    .tile-paramount { background: #0064ff; }
    .tile-tubi { background: #130934; }
    .ai-tiles { flex-direction: column; }
    .ai-tiles .tile-link { background: #fff; }
    .ai-tiles .tile-claude { background: #faf3eb; }

    .tile-link img {
      display: block;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      transition: transform 0.2s ease;
    }
    .ai-tiles img { width: 100%; height: 100%; }
    .tile-link:hover img, .tile-link:focus-visible img { transform: scale(1.04); }
    .axie-gif img { display: block; width: var(--tile-size); height: var(--tile-size); }

    .content-wrapper {
      display: grid;
      grid-template-columns: var(--tile-size) minmax(0, 1fr) minmax(0, 1fr);
      gap: var(--gap);
      margin: calc(var(--gap) * 1.5) 0;
    }
    .left-column, .middle-column {
      display: flex;
      flex-direction: column;
      gap: var(--gap);
      min-width: 0;
      padding-bottom: var(--gap);
    }
    .left-column { background: rgb(94, 67, 109); }
    .middle-column { background: #333; }
    .section-header { background: rgb(75, 0, 130); padding: var(--gap) 4px; text-align: center; }
    h2 { font-size: clamp(7px, min(1.1vw, 1.8svh), 16px); line-height: 1.6; margin: 0; overflow-wrap: anywhere; }

    .button {
      display: flex;
      flex: 1;
      align-items: center;
      justify-content: center;
      min-width: 0;
      margin: 0 var(--gap);
      padding: 2px 4px;
      background: #9b59b6;
      color: white;
      text-decoration: none;
      text-align: center;
      line-height: 1.5;
      overflow-wrap: anywhere;
      position: relative;
      z-index: 1;
      transition: box-shadow 0.1s linear;
    }
    .button:hover, .button:focus-visible { box-shadow: 0 0 20px 10px #8BFFAE; z-index: 10; }
    .split-button-container { display: flex; flex: 1; min-height: 0; }
    .left-column .split-button-container { margin: 0 var(--gap) !important; }
    .split-button { flex: 1; }
    .split-button:hover { background: #8e44ad; }

    @media (max-width: 480px) {
      .split-button { font-size: 0.75rem; }
      .split-button-container { flex: 2; }
    }

    #custom-speech-bubble { pointer-events: none; }

    #random-quote {
      text-align: center;
      font-size: 0.75rem;
      line-height: 1.6;
      font-style: italic;
      color: #ddd;
      margin: 0;
    }
  </style>
  <script>
    const quotes = [
      "What lies behind us and what lies before us are tiny matters compared to what lies within us. — Ralph Waldo Emerson",
      "You are the universe expressing itself as a human for a little while. — Eckhart Tolle",
      "We must be willing to let go of the life we have planned so as to have the life that is waiting for us. — Joseph Campbell",
      "Let yourself be silently drawn by the strange pull of what you really love. It will not lead you astray. — Rumi",
      "If you follow your bliss, doors will open for you that wouldn't have opened for anyone else. — Joseph Campbell",
      "Reality is merely an illusion, albeit a very persistent one. — Albert Einstein",
      "Do not dwell in the past, do not dream of the future, concentrate the mind on the present moment. — Buddha",
      "Forever is composed of nows. — Emily Dickinson",
      "Love is not something you do. Love is the way you are. — Eckhart Tolle",
      "What you think, you become. What you feel, you attract. What you imagine, you create. — Buddha",
      "Fear is the cheapest room in the house. I would like to see you living in better conditions. — Hafiz",
      "You don't see the world as it is, you see it as you are. — Anaïs Nin",
      "Between stimulus and response, there is a space. In that space is our power to choose our response. In our response lies our growth and our freedom. — Viktor Frankl"
    ];

    function displayRandomQuote() {
      const randomIndex = Math.floor(Math.random() * quotes.length);
      document.getElementById('random-quote').textContent = quotes[randomIndex];
    }

    function playRandomVideo() {
      const videos = [
        "8ZSifZ30Cog",
        "videoID2",
        "videoID3"
      ];
      const randomIndex = Math.floor(Math.random() * videos.length);
      window.location.href = `https://www.youtube.com/watch?v=${videos[randomIndex]}&list=PLubQ2wNsM74e1r33xb0WWccF3VMSzevvu`;
    }

    function changeAxieGif() {
      document.getElementById('axie-image').src = 'AxieBlack03.gif';
    }

    function resetAxieGif() {
      document.getElementById('axie-image').src = 'AxieBlack01.gif';
    }

    window.onload = function() {
      displayRandomQuote();
      
      // Add hover effects to all buttons
      const buttons = document.querySelectorAll('.button');
      buttons.forEach(button => {
        button.addEventListener('mouseenter', changeAxieGif);
        button.addEventListener('mouseleave', resetAxieGif);
      });
    };
  </script>
</head>

<!-- Add this small script at the end of your body tag -->
<script>
  document.addEventListener('DOMContentLoaded', function() {
    // Create the speech bubble element
    const speechBubble = document.createElement('div');
    speechBubble.id = 'custom-speech-bubble';
    speechBubble.style.cssText = `
      position: fixed;
      display: none;
      background-color: white;
      color: black;
      border: 3px solid black;
      border-radius: 20px;
      padding: 12px 18px;
      font-size: 16px;
      font-weight: bold;
      text-align: center;
      z-index: 1000;
      max-width: 200px;
      min-width: 150px;
      font-family: 'Press Start 2P', cursive;
    `;
    
    // Create the speech bubble pointer
    const pointer = document.createElement('div');
    pointer.style.cssText = `
      position: absolute;
      width: 20px;
      height: 20px;
      background-color: white;
      border-right: 3px solid black;
      border-bottom: 3px solid black;
      transform: rotate(45deg);
      bottom: -12px;
      left: 50%;
      margin-left: -10px;
    `;
    
    // Add the text container
    const textContainer = document.createElement('div');
    speechBubble.appendChild(textContainer);
    speechBubble.appendChild(pointer);
    document.body.appendChild(speechBubble);
    
    // Get Axie position
    const axieImg = document.getElementById('axie-image');
    
    // Shared function to position speech bubble above Axie
    function positionBubble() {
      if (axieImg) {
        const axieRect = axieImg.getBoundingClientRect();
        speechBubble.style.bottom = (window.innerHeight - axieRect.top + 20) + 'px';
        speechBubble.style.left = (axieRect.left + axieRect.width/2 - 75) + 'px';
      } else {
        // Fallback position if Axie isn't found
        speechBubble.style.bottom = '200px';
        speechBubble.style.left = '50%';
        speechBubble.style.transform = 'translateX(-50%)';
      }
    }
    
    // RadioBox hover
    const radioButton = document.querySelector('a[href*="RadioBox"]');
    if (radioButton) {
      radioButton.addEventListener('mouseenter', function() {
        textContainer.textContent = "xPollutionx's Music!!!";
        positionBubble();
        speechBubble.style.display = 'block';
      });
      radioButton.addEventListener('mouseleave', function() {
        speechBubble.style.display = 'none';
      });
    }
    
    // CoinFused hover
    const coinButton = document.querySelector('a[href*="ConFused"]');
    if (coinButton) {
      coinButton.addEventListener('mouseenter', function() {
        textContainer.textContent = "xPollutionx's Price Comparison Tool!!!";
        positionBubble();
        speechBubble.style.display = 'block';
      });
      coinButton.addEventListener('mouseleave', function() {
        speechBubble.style.display = 'none';
      });
    }
    
    // Snake hover
    const snakeButton = document.querySelector('a[href*="SnakePlus"]');
    if (snakeButton) {
      snakeButton.addEventListener('mouseenter', function() {
        textContainer.textContent = "xPollutionx's Snake game w/ some twists!!!";
        positionBubble();
        speechBubble.style.display = 'block';
      });
      snakeButton.addEventListener('mouseleave', function() {
        speechBubble.style.display = 'none';
      });
    }
  });
</script>

<!-- Add this script to enable app links on mobile -->
<script>
  document.addEventListener('DOMContentLoaded', function() {
    // ONLY handle app intents on mobile, nothing else changes
    if (/Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)) {
      
      // Fix Discord link to always go to /channels/@me
      const discordLink = document.querySelector('a[href*="https://discord.com/channels/@me"]');
      if (discordLink) {
        // Update the href directly 
        discordLink.href = "https://discord.com/channels/@me";
        
        // Add app opening capability
        discordLink.addEventListener('click', function(e) {
          e.preventDefault();
          
          // Try to open Discord app
          window.location.href = 'discord://';
          
          // Fall back to web after delay
          setTimeout(function() {
            window.location.href = "https://discord.com/channels/@me";
          }, 500);
        });
      }
      
      // Handle other app links without changing original functionality
      const youtubeLink = document.querySelector('a[href*="youtube.com"]');
      if (youtubeLink) {
        const origUrl = youtubeLink.href;
        youtubeLink.addEventListener('click', function(e) {
          e.preventDefault();
          
          // Try app first
          window.location.href = 'youtube://';
          
          // Fall back to web after delay
          setTimeout(function() {
            window.location.href = origUrl;
          }, 500);
        });
      }
      
      // X.com

          // Try app first
          window.location.href = 'twitter://';
          
          // Fall back to web after delay

            window.location.href = origUrl;
          }, 500);

          // Fall back to web after delay
          setTimeout(function() {
            window.location.href = origUrl;
          }, 500);
        });
      }
    }
  });
</script>

<!-- Add this minimal script that ONLY changes the Discord link and nothing else -->
<script>
  // Run this code immediately without waiting for DOMContentLoaded
  (function() {
    // Use a more specific selector to target exactly the Discord link
    var links = document.querySelectorAll('a');
    
    // Loop through all links to find Discord
    for (var i = 0; i < links.length; i++) {
      if (links[i].href && links[i].href.includes('discord.com')) {
        // Directly set the href using setAttribute to avoid any issues
        links[i].setAttribute('href', 'https://discord.com/channels/@me');
        
        // Also set the HTML attribute to be extra sure
        links[i].outerHTML = links[i].outerHTML.replace(/href=".*?discord\.com.*?"/, 'href="https://discord.com/channels/@me"');
        
        console.log("Discord link updated to: https://discord.com/channels/@me");
      }
    }
  })();
</script>

<!-- Add this script to restore speech bubble functionality -->
<script>
  document.addEventListener('DOMContentLoaded', function() {
    // Create or get speech bubble element
    let speechBubble = document.getElementById('custom-speech-bubble');
    if (!speechBubble) {
      speechBubble = document.createElement('div');
      speechBubble.id = 'custom-speech-bubble';
      speechBubble.style.cssText = `
        position: fixed;
        display: none;
        background-color: white;
        color: black;
        border: 3px solid black;
        border-radius: 20px;
        padding: 12px 18px;
        font-size: 16px;
        font-weight: bold;
        text-align: center;
        z-index: 1000;
        max-width: 200px;
        min-width: 150px;
        font-family: 'Press Start 2P', cursive;
      `;
      
      const pointer = document.createElement('div');
      pointer.style.cssText = `
        position: absolute;
        width: 20px;
        height: 20px;
        background-color: white;
        border-right: 3px solid black;
        border-bottom: 3px solid black;
        transform: rotate(45deg);
        bottom: -12px;
        left: 50%;
        margin-left: -10px;
      `;
      
      const textContainer = document.createElement('div');
      speechBubble.appendChild(textContainer);
      speechBubble.appendChild(pointer);
      document.body.appendChild(speechBubble);
    }
    
    // Get all app links
    const radioBoxLink = document.querySelector('a[href*="RadioBox"]');
    const snakePlusLink = document.querySelector('a[href*="SnakePlus"]');
    const checkMakerLink = document.querySelector('a[href*="432CheckMaker"]');
    const mindMixLink = document.querySelector('a[href*="MindMix"]');
    const coinFusedLink = document.querySelector('a[href*="ConFused"]');
    
    // Function to position bubble above Axie
    function positionBubble() {
      const axieImg = document.getElementById('axie-image');
      if (!axieImg) return;
      const rect = axieImg.getBoundingClientRect();
      const width = speechBubble.offsetWidth;
      const height = speechBubble.offsetHeight;
      // Keep the bubble inside the screen, below Axie when space permits.
      speechBubble.style.bottom = 'auto';
      speechBubble.style.left = Math.max(12, Math.min(window.innerWidth - width - 12, rect.left + rect.width / 2 - width / 2)) + 'px';
      speechBubble.style.top = Math.max(12, Math.min(window.innerHeight - height - 12, rect.bottom + 12)) + 'px';
      const pointer = speechBubble.children[1];
      pointer.style.bottom = 'auto';
      pointer.style.top = '-12px';
      pointer.style.transform = 'rotate(225deg)';
    }

    // Function to show speech bubble with text
    function showSpeech(text) {
      speechBubble.querySelector('div').textContent = text;
      speechBubble.style.display = 'block';
      positionBubble();
      if (typeof changeAxieGif === 'function') {
        changeAxieGif();
      }
    }
    
    // Function to hide speech bubble
    function hideSpeech() {
      speechBubble.style.display = 'none';
      if (typeof resetAxieGif === 'function') {
        resetAxieGif();
      }
    }
    
    // Add event listeners for RadioBox
    if (radioBoxLink) {
      radioBoxLink.addEventListener('mouseenter', function() {
        showSpeech("xPollutionx's Music!!!");
      });
      radioBoxLink.addEventListener('mouseleave', hideSpeech);
    }
    
    // Add event listeners for Snake Plus
    if (snakePlusLink) {
      snakePlusLink.addEventListener('mouseenter', function() {
        showSpeech("xPollutionx's Snake game w/ some twists!!!");
      });
      snakePlusLink.addEventListener('mouseleave', hideSpeech);
    }
    
    // Add event listeners for 432CheckMaker
    if (checkMakerLink) {
      checkMakerLink.addEventListener('mouseenter', function() {
        showSpeech("432 Freq Checker Maker!!!");
      });
      checkMakerLink.addEventListener('mouseleave', hideSpeech);
    }
    
    // Add event listeners for MindMix
    if (mindMixLink) {
      mindMixLink.addEventListener('mouseenter', function() {
        showSpeech("xPollutionx's Audio Transformer!!!");
      });
      mindMixLink.addEventListener('mouseleave', hideSpeech);
    }
    
    // Add event listeners for CoinFused
    if (coinFusedLink) {
      coinFusedLink.addEventListener('mouseenter', function() {
        showSpeech("xPollutionx's Price Comparison Tool!!!");
      });
      coinFusedLink.addEventListener('mouseleave', hideSpeech);
    }
  });
</script>
